name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: upload
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
